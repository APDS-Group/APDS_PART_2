<!doctype html>
<html ng-app="app" lang="en" xml:lang="en">
<head>
    <title>AngularJS Sprintf Demo Tests</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.0-rc.3/angular.min.js"></script>
    <script src="../src/sprintf.js"></script>
    <script src="../src/angular-sprintf.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-mocks/1.3.0-rc.3/angular-mocks.js"></script>
</head>
<body>
    <div ng-controller="TestController">
        <pre id="test1">{{ "%+010d"|sprintf:-123 }}</pre>
        <pre id="test2">{{ "%+010d"|vsprintf:[-123] }}</pre>
        <pre id="test3">{{ "%+010d"|fmt:-123 }}</pre>
        <pre id="test4">{{ "%+010d"|vfmt:[-123] }}</pre>
        <pre id="test5">{{ "I've got %2$d apples and %1$d oranges."|fmt:4:2 }}</pre>
        <pre id="test6">{{ "I've got %(apples)d apples and %(oranges)d oranges."|fmt:{apples: 2, oranges: 4} }}</pre>
    </div>

    <script>
        angular.module("app", ["sprintf", "ngMockE2E"])
            .controller("TestController", function($scope) {
                // Controller logic if needed
            });

        describe('AngularJS Sprintf Demo Tests', function() {
            beforeEach(module('app'));

            var $compile, $rootScope;

            beforeEach(inject(function(_$compile_, _$rootScope_) {
                $compile = _$compile_;
                $rootScope = _$rootScope_;
            }));

            it('should format numbers correctly with sprintf', function() {
                var element = $compile('<pre>{{ "%+010d"|sprintf:-123 }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe('+000000-123');
            });

            it('should format numbers correctly with vsprintf', function() {
                var element = $compile('<pre>{{ "%+010d"|vsprintf:[-123] }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe('+000000-123');
            });

            it('should format numbers correctly with fmt', function() {
                var element = $compile('<pre>{{ "%+010d"|fmt:-123 }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe('+000000-123');
            });

            it('should format numbers correctly with vfmt', function() {
                var element = $compile('<pre>{{ "%+010d"|vfmt:[-123] }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe('+000000-123');
            });

            it('should format strings with positional arguments correctly', function() {
                var element = $compile('<pre>{{ "I\'ve got %2$d apples and %1$d oranges."|fmt:4:2 }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe("I've got 2 apples and 4 oranges.");
            });

            it('should format strings with named arguments correctly', function() {
                var element = $compile('<pre>{{ "I\'ve got %(apples)d apples and %(oranges)d oranges."|fmt:{apples: 2, oranges: 4} }}</pre>')($rootScope);
                $rootScope.$digest();
                expect(element.text()).toBe("I've got 2 apples and 4 oranges.");
            });
        });
    </script>
</body>
</html>
