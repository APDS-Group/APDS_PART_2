<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Node-webkit-based module test - Test Suite</title>
<script>
function testNwModuleTest() {
    var util = {
        log: function(message) {
            console.log(message);
        }
    };
    var process = {
        platform: 'linux',
        exit: function(code) {
            console.log('Process exited with code:', code);
        }
    };
    var require = function(module) {
        if (module === 'invalidModule') {
            throw new Error('Module not found');
        }
    };
    var nw = {
        gui: {
            App: {
                argv: ['invalidModule']
            }
        }
    };

    var moduleFolder = nw.gui.App.argv[0];
    try {
        require(moduleFolder);
    } catch (e) {
        if (process.platform !== 'win32') {
            util.log('nw-pre-gyp error:');
            util.log(e.stack);
        }
        process.exit(1);
    }
    process.exit(0);
}

function runTests() {
    console.log('Running test for nwModuleTest...');
    testNwModuleTest();
    console.log('Test completed.');
}

</script>
</head>
<body onload="runTests()">
<h1>Node-webkit-based module test - Test Suite</h1>
</body>
</html></body></html>
